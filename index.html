<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaveScript Mini Demo </title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      line-height: 1.5;
      color: #000000;
      background: #ffffff;
    }

    section {
      min-height: 100vh;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgb(156, 156, 156);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1, h2 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    p.desc {
      color: #4b4b4b;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
    }

    input, select, button {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-size: 1rem;
      border: 1px solid #000000;
      border-radius: 8px;
      margin-bottom: 1rem;
      background-color: rgb(209, 209, 209);
    }

    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    button {
      background: #582e8e;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #974aca;;
    }

    .result {
      background: #bcbcbc;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 0.5rem;
      font-size: 0.90rem;
      min-height: 3rem;
      display: flex;
      align-items: center;
    }
    #date-section    { background: #6994cc; }
    #convert-section { background: #59a971; }
    #math-section    { background: #b95c5c; }

    .row {
      display: flex;
      gap: 0.75rem;
    }

    .row > * {
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- ==================== 1. DATE SECTION ==================== -->
  <section id="date-section">
    <div class="card">
      <h1>Todays date</h1>
      <div class="result" id="today-date">.</div>
    </div>
  </section>

  <!-- ==================== 2. NUMBER CONVERTER + VALIDATION ==================== -->
  <section id="convert-section">
    <div class="card">
      <h2>Number Conversion Tests</h2>
    <p class="desc">
      Enter a value below.
    </p>

    <label for="user-input">Enter a value</label>
    <input type="text" id="user-input" placeholder='Try: 42, 19.75, hello, 100, 3.14, abc'>

    <button id="convert-btn">Convert</button>

    <div id="conversion-output" class="result">
    ...
    </div>
    </div>
  </section>

  <!-- ==================== 3. FORMATTING & MATH ==================== -->
  <section id="math-section">
    <div class="card">
      <h2>Sales Tax Calculator</h2>
    <p class="desc">Enter the price and the sales tax rate in your area.</p>

    <div class="row">
      <div>
        <label for="price">Price ($)</label>
        <input type="text" id="price" placeholder="0.00" step="0.01" min="0">
      </div>
      <div>
        <label for="tax-rate">Sales tax in your area (%)</label>
        <input type="text" id="tax-rate" placeholder="e.g. 8.25" step="0.01" min="0">
      </div>
    </div>

    <button id="calculate-btn">Calculate</button>

    <div class="result" id="math-result">
      ...
    </div>
    </div>
  </section>
<script src="script.js"></script>
</body>
</html>
